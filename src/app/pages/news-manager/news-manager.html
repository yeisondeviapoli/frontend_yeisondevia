<p>news-manager works!</p>
<div class="container py-5"><div class="row g-5"><div class="col-lg-6"><span class="eyebrow">MINI-CRUD</span><h1 class="fw-bold">Gestionar noticias</h1><form class="card p-4 shadow-sm mt-4" (ngSubmit)="submit()"><input class="form-control mb-3" name="title" [(ngModel)]="form.title" placeholder="Título" required><select class="form-select mb-3" name="category" [(ngModel)]="form.category"><option>Educación</option><option>Tecnología</option><option>Turismo</option><option>Comercio</option></select><input class="form-control mb-3" name="image" [(ngModel)]="form.image" placeholder="URL de imagen"><textarea class="form-control mb-3" name="description" [(ngModel)]="form.description" placeholder="Descripción breve" rows="2" required></textarea><textarea class="form-control mb-3" name="content" [(ngModel)]="form.content" placeholder="Contenido completo" rows="5" required></textarea><button class="btn btn-primary">Publicar noticia</button></form></div><div class="col-lg-6"><h2 class="h4">Noticias publicadas</h2><div class="list-group mt-3"><div class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let n of service.items()"><span><strong>{{n.title}}</strong><small class="d-block text-secondary">{{n.category}}</small></span><button class="btn btn-sm btn-outline-danger" (click)="service.remove(n.id)"><i class="bi bi-trash"></i></button></div></div></div></div></div>
