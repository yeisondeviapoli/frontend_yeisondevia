<div class="container py-5" *ngIf="news as n"><a routerLink="/noticias" class="text-decoration-none">← Volver a noticias</a><img [src]="n.image" class="detail-image w-100 rounded mt-3" [alt]="n.title"><span class="badge text-bg-primary mt-4">{{n.category}}</span><h1 class="display-5 fw-bold mt-2">{{n.title}}</h1><p class="text-secondary">Por {{n.author}} · {{n.date}}</p><p class="lead mt-4">{{n.description}}</p><p class="article-content">{{n.content}}</p><div class="d-flex gap-2"><button class="btn btn-primary" (click)="toggle()"><i class="bi bi-heart me-2"></i>{{favorites.has(n.id) ? 'Quitar de favoritos' : 'Agregar a favoritos'}}</button><a class="btn btn-outline-secondary" routerLink="/contacto">Contactar</a></div></div>
