<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><span class="eyebrow">CONTACTO</span><h1 class="fw-bold">Hablemos</h1><p class="text-secondary">¿Tienes una historia, pregunta o propuesta? Escríbenos.</p><div class="alert alert-success" *ngIf="sent">Mensaje enviado. Gracias por contactarnos.</div><form class="card p-4 shadow-sm" (ngSubmit)="submit()" #contactForm="ngForm"><label class="form-label">Nombre<input class="form-control" name="name" [(ngModel)]="form.name" required></label><label class="form-label">Correo electrónico<input class="form-control" type="email" name="email" [(ngModel)]="form.email" required email></label><label class="form-label">Mensaje<textarea class="form-control" name="message" [(ngModel)]="form.message" rows="5" required></textarea></label><button class="btn btn-primary" [disabled]="contactForm.invalid">Enviar mensaje</button></form></div></div></div>
